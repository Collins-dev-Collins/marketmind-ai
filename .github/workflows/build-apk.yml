
name: Build MarketMind AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract MarketMind AI source
        run: |
          unzip -o MarketMind-AI-Source.zip -d .
          test -f marketmind-ai/package.json
          test -f marketmind-ai/capacitor.config.json || test -f marketmind-ai/capacitor.config.ts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install project dependencies
        working-directory: marketmind-ai
        run: npm install

      - name: Add Android platform
        working-directory: marketmind-ai
        run: npx cap add android

      - name: Synchronize Android project
        working-directory: marketmind-ai
        run: npx cap sync android

      - name: Build debug APK
        working-directory: marketmind-ai/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarketMind-AI-Android-APK
          path: marketmind-ai/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
