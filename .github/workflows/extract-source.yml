
name: Extract MarketMind AI Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source archive
        run: |
          unzip -o MarketMind-AI-Source.zip -d .
          test -f marketmind-ai/backend/app/main.py
          test -f marketmind-ai/package.json

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketmind-ai
          git diff --cached --quiet || git commit -m "Extract MarketMind AI source"
          git push
